<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Warenkorb — TRIAD ARCHIV</title>
<meta name="theme-color" content="#121110">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
  /* ================= Seiten-spezifisch: Warenkorb ================= */

  .cart-wrap{
    max-width:860px;
    margin:0 auto;
    padding:0 var(--pad-x) var(--s6);
  }

  .cart-empty{
    text-align:center;
    padding:72px 24px;
    background:var(--surface);
    border:1px solid var(--line);
    color:var(--muted);
    font-size:15px;
    font-weight:300;
    line-height:1.8;
  }
  .cart-empty a{
    display:inline-block;
    margin-top:14px;
    font-family:var(--font-mono);
    font-size:12px;
    letter-spacing:2px;
    text-transform:uppercase;
    color:var(--text);
    text-decoration:none;
    border-bottom:1px solid var(--line-strong);
    padding-bottom:4px;
    transition:border-color .2s ease;
  }
  .cart-empty a:hover{ border-color:var(--text); }

  /* Positionen wie Katalogzeilen */
  .cart-list{
    display:flex;
    flex-direction:column;
    border-top:1px solid var(--line-strong);
  }

  .cart-item{
    display:flex;
    align-items:center;
    gap:18px;
    padding:18px 0;
    border-bottom:1px solid var(--line);
  }
  .cart-item-thumb{
    position:relative;
    flex:0 0 auto;
    width:64px;
    height:80px;               /* 4:5 wie die Produktbilder */
    overflow:hidden;
    background:var(--tile);
    border:1px solid var(--line);
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    color:var(--faint);
    font-family:var(--font-mono);
    font-size:8px;
    letter-spacing:0.3px;
    line-height:1.3;
    text-transform:uppercase;
    padding:4px;
  }
  /* ganzes Bild einpassen statt beschneiden/verzerren */
  .cart-item-thumb img{
    width:100%;
    height:100%;
    object-fit:contain;
    object-position:center;
    display:block;
  }
  /* aus der Shop-Kachel mitkopierte Tags im Thumbnail ausblenden */
  .cart-item-thumb .badge,
  .cart-item-thumb .stamp{ display:none; }
  /* Archiv-Platzhalter (fehlendes Bild) kompakt darstellen */
  .cart-item-thumb .img-placeholder{
    padding:4px;
    gap:4px;
    font-size:7px;
    letter-spacing:0.5px;
    line-height:1.5;
  }
  .cart-item-thumb .img-placeholder .stripes{ display:none; }
  .cart-item-info{
    flex:1;
    min-width:0;
    display:flex;
    flex-direction:column;
    gap:6px;
  }
  .cart-item-info .name{
    font-family:var(--font-sans);
    font-size:14px;
    font-weight:500;
    letter-spacing:0.2px;
    color:var(--text);
  }
  .cart-item-info .size{
    font-family:var(--font-mono);
    font-size:10px;
    letter-spacing:1.5px;
    text-transform:uppercase;
    color:var(--faint);
  }
  .cart-item-side{
    flex:0 0 auto;
    display:flex;
    flex-direction:column;
    align-items:flex-end;
    gap:10px;
  }
  .cart-item-side .price{
    font-family:var(--font-mono);
    font-size:14px;
    font-weight:500;
    color:var(--text);
    font-variant-numeric:tabular-nums;   /* Ziffern gleich breit → Preise fluchten */
  }
  .cart-item .qty-controls{
    display:flex;
    align-items:center;
    gap:10px;
    font-family:var(--font-mono);
    font-size:12px;
    color:var(--muted);
    font-variant-numeric:tabular-nums;
  }
  .qty-controls button{
    width:26px;
    height:26px;
    background:none;
    border:1px solid var(--line-strong);
    color:var(--text);
    cursor:pointer;
    font-family:var(--font-sans);
    font-size:14px;
    line-height:1;
    transition:border-color .15s ease, background .15s ease, color .15s ease;
  }
  .qty-controls button:hover{ background:var(--text); border-color:var(--text); color:var(--bg); }
  .remove-btn{
    flex:0 0 auto;
    align-self:flex-start;
    background:none;
    border:none;
    color:var(--faint);
    cursor:pointer;
    font-family:var(--font-sans);
    font-size:16px;
    line-height:1;
    padding:0 0 0 6px;
    transition:color .15s ease;
  }
  .remove-btn:hover{ color:var(--text); }

  /* Summenblock wie ein Beleg */
  .cart-summary{
    margin-top:18px;
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .summary-row{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    font-family:var(--font-mono);
    font-size:12px;
    letter-spacing:1px;
    text-transform:uppercase;
    color:var(--muted);
    font-variant-numeric:tabular-nums;
  }
  .summary-row .free{ color:var(--text); }
  .summary-row.discount span:last-child{ color:var(--accent); }

  /* ---- Rabattcode ---- */
  .discount-box{
    margin-top:14px;
    padding-top:14px;
    border-top:1px solid var(--line);
  }
  .discount-toggle{
    background:none;
    border:none;
    color:var(--muted);
    font-family:var(--font-mono);
    font-size:11px;
    letter-spacing:1.5px;
    text-transform:uppercase;
    cursor:pointer;
    padding:2px 0;
    border-bottom:1px solid transparent;
    transition:color .15s ease, border-color .15s ease;
  }
  .discount-toggle:hover{ color:var(--text); border-color:var(--line-strong); }
  .discount-fields{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-top:12px;
  }
  .discount-fields input{
    flex:1 1 160px;
    min-width:0;
    background:var(--tile);
    border:1px solid var(--line-strong);
    color:var(--text);
    font-family:var(--font-mono);
    font-size:12px;
    letter-spacing:0.5px;
    padding:11px 12px;
    border-radius:0;
    outline:none;
    transition:border-color .15s ease;
  }
  .discount-fields input::placeholder{ color:var(--faint); text-transform:none; letter-spacing:0.3px; }
  .discount-fields input:focus{ border-color:var(--text); }
  .discount-fields input#discountCode{ text-transform:uppercase; }
  .discount-fields button{
    flex:0 0 auto;
    background:var(--text);
    border:1px solid var(--text);
    color:var(--bg);
    font-family:var(--font-sans);
    font-size:12px;
    font-weight:600;
    letter-spacing:1.5px;
    text-transform:uppercase;
    padding:0 20px;
    cursor:pointer;
    transition:background .2s ease, color .2s ease;
  }
  .discount-fields button:hover{ background:transparent; color:var(--text); }
  .discount-fields button:disabled{ opacity:.55; cursor:default; }
  .discount-msg{
    flex:1 1 100%;
    font-family:var(--font-mono);
    font-size:11px;
    letter-spacing:0.3px;
    line-height:1.5;
    margin-top:2px;
  }
  .discount-msg.err{ color:var(--accent); }
  .discount-msg.ok{ color:var(--muted); }
  .discount-applied{
    margin-top:14px;
    padding:12px 14px;
    border:1px solid var(--line-strong);
    background:var(--tile);
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    font-family:var(--font-mono);
    font-size:11px;
    letter-spacing:1px;
    text-transform:uppercase;
    color:var(--text);
  }
  .discount-applied .code{ color:var(--accent); font-weight:600; }
  .discount-applied button{
    background:none;
    border:none;
    color:var(--faint);
    font-family:var(--font-mono);
    font-size:10px;
    letter-spacing:1.5px;
    text-transform:uppercase;
    cursor:pointer;
    padding:2px 0;
    border-bottom:1px solid transparent;
    transition:color .15s ease, border-color .15s ease;
  }
  .discount-applied button:hover{ color:var(--text); border-color:var(--line-strong); }
  .cart-total{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    margin-top:8px;
    padding:18px 0;
    border-top:1px solid var(--line-strong);   /* Summe klar von Positionen abgesetzt */
    font-family:var(--font-mono);
    font-size:12px;
    text-transform:uppercase;
    letter-spacing:2px;
    color:var(--muted);
  }
  .cart-total .amount{
    color:var(--text);
    font-weight:500;
    font-size:22px;                            /* Endsumme als visueller Anker */
    letter-spacing:0.5px;
    font-variant-numeric:tabular-nums;
  }

  .ship-note{
    margin-top:-6px;
    padding-bottom:6px;
    font-family:var(--font-mono);
    font-size:11px;
    line-height:1.6;
    letter-spacing:0.3px;
    color:var(--faint);
  }

  /* Button-Gruppe unter dem Warenkorb */
  .cart-cta{
    display:flex;
    flex-direction:column;
    gap:10px;
    margin:24px 0 14px;
  }
  .checkout-btn,
  .continue-btn{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    width:100%;
    font-family:var(--font-sans);
    font-size:13px;
    font-weight:600;
    letter-spacing:2px;
    text-transform:uppercase;
    text-decoration:none;
    padding:17px 20px;
    border-radius:0;
    cursor:pointer;
    transition:background .25s ease, color .25s ease, border-color .25s ease, transform .1s ease;
  }
  /* primäre CTA: Zur Kasse / bezahlen */
  .checkout-btn{
    background:var(--text);
    border:1px solid var(--text);
    color:var(--bg);
  }
  .checkout-btn:hover{ background:transparent; color:var(--text); border-color:var(--text); }
  .checkout-btn:disabled{ opacity:.6; cursor:default; }
  /* sekundär: weiter einkaufen */
  .continue-btn{
    background:transparent;
    border:1px solid var(--line-strong);
    color:var(--text);
  }
  .continue-btn:hover{ border-color:var(--text); }
  .checkout-btn:active,
  .continue-btn:active{ transform:translateY(1px); }

  .paypal-divider{
    text-align:center;
    font-family:var(--font-mono);
    font-size:10px;
    letter-spacing:2px;
    text-transform:uppercase;
    color:var(--faint);
    margin:2px 0;
  }
  #paypalButtonContainer{ min-height:45px; }

  /* Zahlarten sichtbar machen: vorher sah der Warenkorb aus, als gaebe es nur PayPal */
  .pay-methods{
    display:flex; flex-direction:column; align-items:center; gap:7px;
    margin:14px 0 2px; padding-top:14px;
    border-top:1px solid var(--line);
    text-align:center;
  }
  .pay-methods .pm-label{
    font-family:var(--font-mono); font-size:9.5px; letter-spacing:2px;
    text-transform:uppercase; color:var(--faint);
  }
  .pay-methods .pm-list{ display:flex; flex-wrap:wrap; justify-content:center; gap:7px; }
  .pay-methods .pm{
    display:inline-flex; align-items:center; justify-content:center;
    height:32px; padding:0 11px;
    border:1px solid var(--line-strong); border-radius:4px;
    color:var(--text); white-space:nowrap;
    opacity:.82; transition:opacity .2s ease, border-color .2s ease;
  }
  .pay-methods .pm:hover{ opacity:1; border-color:var(--text); }
  .pay-methods .pm svg{ display:block; }
  /* Amazon Pay liegt nicht als Zeichen vor -> saubere Wortmarke in gleicher Hoehe */
  .pay-methods .pm-text{
    font-family:var(--font-mono); font-size:10px; letter-spacing:1px;
  }
  .pay-methods .pm-hl{ border-color:var(--text); }
  .pay-methods .pm-note{
    font-size:11px; line-height:1.5; color:var(--muted); max-width:34ch; margin-top:3px;
  }

  .cart-actions{
    display:flex;
    justify-content:flex-end;
  }
  .clear-btn{
    background:none;
    border:none;
    color:var(--faint);
    font-family:var(--font-mono);
    font-size:10px;
    text-transform:uppercase;
    letter-spacing:2px;
    padding:8px 0;
    cursor:pointer;
    border-bottom:1px solid transparent;
    transition:color .15s ease, border-color .15s ease;
  }
  .clear-btn:hover{ color:var(--text); border-color:var(--line-strong); }
</style>
</head>
<body>

<header>
  <a class="logo" href="shop.html">
    <span class="stripes"><span></span><span></span><span></span></span>
    TRIAD <span class="archive">ARCHIV</span>
  </a>
  <div class="header-icons">
    <a href="shop.html">Zurück zum Archiv</a>
  </div>
</header>

<h1 class="page-title">Warenkorb</h1>
<p class="page-title-sub">Deine Auswahl aus dem Archiv</p>

<div class="cart-wrap" id="cartWrap"></div>

<footer>
  <div class="foot-inner">
    <div class="foot-logo">
      <span class="stripes"><span></span><span></span><span></span></span>
      Triad Archiv
    </div>
    <div class="foot-links">
      <a href="shop.html">Archiv</a>
      <a href="versand.html">Versand</a>
      <a href="impressum.html">Impressum</a>
      <a href="datenschutz.html">Datenschutz</a>
      <a href="widerruf.html">Widerruf</a>
      <a href="agb.html">AGB</a>
    </div>
  </div>
  <div class="foot-copy">© 2026 TRIAD ARCHIV — Alle Rechte vorbehalten.</div>
</footer>

<script>
  const cartWrap = document.getElementById('cartWrap');

  // Versandkosten (muss mit checkout.mjs und versand.html übereinstimmen).
  // Anzeige hier ist der DE-Richtwert; bei Lieferung ins EU-Ausland wählt der Kunde
  // beim Bezahlvorgang (Stripe) die passende, teurere Option selbst aus.
  const SHIPPING = 6.19;
  const FREE_FROM = 90;

  function fmt(n){ return n.toFixed(2).replace('.', ',') + '€'; }
  function round2(n){ return Math.round((Number(n)||0) * 100) / 100; }

  function loadCart(){
    return JSON.parse(localStorage.getItem('triadCart') || '[]');
  }
  function saveCart(cart){
    localStorage.setItem('triadCart', JSON.stringify(cart));
  }

  /* ---------- Rabattcode ---------- */
  // Gespeichert wird ein bereits vom Server geprüfter Rabatt: {code, email, percent}
  function loadDiscount(){
    try { return JSON.parse(localStorage.getItem('triadDiscount') || 'null'); }
    catch(e){ return null; }
  }
  function saveDiscount(d){ localStorage.setItem('triadDiscount', JSON.stringify(d)); }
  function clearDiscount(){ localStorage.removeItem('triadDiscount'); }

  async function applyDiscount(){
    const codeEl = document.getElementById('discountCode');
    const emailEl = document.getElementById('discountEmail');
    const msgEl = document.getElementById('discountMsg');
    const btn = document.getElementById('discountApply');
    const code = (codeEl.value || '').trim();
    const email = (emailEl.value || '').trim();

    if(!code){ showDiscountMsg('Bitte einen Code eingeben.', 'err'); return; }
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){ showDiscountMsg('Bitte eine gültige E-Mail eingeben.', 'err'); return; }

    btn.disabled = true;
    const original = btn.textContent;
    btn.textContent = 'Prüfe …';
    try {
      const r = await fetch('/api/validate-code', {
        method:'POST',
        headers:{ 'Content-Type':'application/json' },
        body: JSON.stringify({ code, email })
      });
      const data = await r.json();
      if(data.valid){
        saveDiscount({ code: code.toUpperCase(), email: email.toLowerCase(), percent: data.percent });
        renderCart();
        return;
      }
      const reasons = {
        unknown: 'Dieser Code ist ungültig.',
        email: 'Bitte eine gültige E-Mail eingeben.',
        used: 'Dieser Code wurde für diese E-Mail bereits genutzt (gilt nur für die erste Bestellung).',
      };
      showDiscountMsg(reasons[data.reason] || 'Code konnte nicht eingelöst werden.', 'err');
    } catch(e){
      showDiscountMsg('Verbindung fehlgeschlagen. Bitte später erneut versuchen.', 'err');
    } finally {
      const b = document.getElementById('discountApply');
      if(b){ b.disabled = false; b.textContent = original; }
    }
  }

  function showDiscountMsg(text, kind){
    const msgEl = document.getElementById('discountMsg');
    if(!msgEl) return;
    msgEl.textContent = text;
    msgEl.className = 'discount-msg ' + (kind || '');
  }

  function escapeHtml(str){
    return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  // Rabatt-Payload für Checkout (nur Code + E-Mail; der Server prüft erneut).
  function discountPayload(){
    const d = loadDiscount();
    return d ? { code: d.code, email: d.email } : null;
  }

  // Für Bezahlung: gewählte Größe in den Artikelnamen schreiben, damit sie in der
  // Stripe/PayPal-Bestellung sichtbar ist (wichtig fürs Packen). id/Preis bleiben gleich.
  function checkoutItems(){
    return loadCart().map(it => ({
      ...it,
      name: (it.size && it.size !== 'Onesize') ? `${it.name} (Größe ${it.size})` : it.name
    }));
  }

  function startCheckout(){
    const cart = loadCart();
    if(cart.length === 0) return;
    const btn = document.getElementById('checkoutBtn');
    const original = btn.textContent;
    btn.disabled = true;
    btn.textContent = 'Weiterleitung zu Stripe …';
    fetch('/api/checkout', {
      method:'POST',
      headers:{ 'Content-Type':'application/json' },
      body: JSON.stringify({ items: checkoutItems(), discount: discountPayload() })
    })
      .then(r => r.json())
      .then(data => {
        if(data.url){ window.location.href = data.url; }   // Stripe-Bezahlseite
        else { throw new Error(data.error || 'Unbekannter Fehler'); }
      })
      .catch(err => {
        btn.disabled = false;
        btn.textContent = original;
        alert('Zahlung konnte nicht gestartet werden:\n' + err.message);
      });
  }

  /* ---------- PayPal ---------- */
  let paypalSdkPromise = null;
  function loadPaypalSdk(){
    if(paypalSdkPromise) return paypalSdkPromise;
    paypalSdkPromise = fetch('/api/paypal-config')
      .then(r => r.json())
      .then(cfg => new Promise((resolve, reject) => {
        if(!cfg.clientId){ reject(new Error('PayPal ist noch nicht eingerichtet.')); return; }
        if(window.paypal){ resolve(window.paypal); return; }
        const s = document.createElement('script');
        s.src = `https://www.paypal.com/sdk/js?client-id=${encodeURIComponent(cfg.clientId)}&currency=EUR&intent=capture`;
        s.onload = () => resolve(window.paypal);
        s.onerror = () => reject(new Error('PayPal konnte nicht geladen werden.'));
        document.head.appendChild(s);
      }));
    return paypalSdkPromise;
  }

  function renderPaypalButtons(){
    const container = document.getElementById('paypalButtonContainer');
    if(!container) return;
    container.innerHTML = '';
    loadPaypalSdk().then(paypal => {
      paypal.Buttons({
        style: { layout:'horizontal', color:'gold', shape:'rect', label:'paypal', height:45, tagline:false },
        createOrder: () => fetch('/api/paypal-create-order', {
          method:'POST',
          headers:{ 'Content-Type':'application/json' },
          body: JSON.stringify({ items: checkoutItems(), discount: discountPayload() })
        }).then(r => r.json()).then(data => {
          if(!data.id) throw new Error(data.error || 'PayPal-Bestellung fehlgeschlagen.');
          return data.id;
        }),
        onApprove: (data) => fetch('/api/paypal-capture-order', {
          method:'POST',
          headers:{ 'Content-Type':'application/json' },
          body: JSON.stringify({ orderID: data.orderID })
        }).then(r => r.json()).then(res => {
          if(!res.ok) throw new Error(res.error || 'Zahlung konnte nicht abgeschlossen werden.');
          localStorage.removeItem('triadCart');
          window.location.href = 'success.html?paypal=1';
        }).catch(err => alert('PayPal-Zahlung fehlgeschlagen:\n' + err.message)),
        onError: (err) => alert('PayPal-Zahlung fehlgeschlagen:\n' + (err && err.message ? err.message : err))
      }).render(container);
    }).catch(err => { console.error(err); container.innerHTML = ''; });
  }

  function renderCart(){
    const cart = loadCart();

    if(cart.length === 0){
      cartWrap.innerHTML = `
        <div class="cart-empty">
          Dein Warenkorb ist noch leer.<br>
          <a href="shop.html">Zum Archiv →</a>
        </div>`;
      return;
    }

    const itemsHtml = cart.map((item, i) => `
      <div class="cart-item">
        <div class="cart-item-thumb">${item.thumb || 'Adidas<br>Produkt'}</div>
        <div class="cart-item-info">
          <div class="name">${escapeHtml(item.name)}</div>
          <div class="size">Größe: ${escapeHtml(item.size || 'Onesize')}</div>
        </div>
        <div class="cart-item-side">
          <div class="price">${fmt(item.price * item.qty)}</div>
          <div class="qty-controls">
            <button data-action="dec" data-index="${i}" aria-label="Menge verringern">–</button>
            <span>${item.qty}</span>
            <button data-action="inc" data-index="${i}" aria-label="Menge erhöhen">+</button>
          </div>
        </div>
        <button class="remove-btn" data-action="remove" data-index="${i}" aria-label="Artikel entfernen">✕</button>
      </div>`).join('');

    const subtotal = cart.reduce((sum, item) => sum + item.price * item.qty, 0);
    const discount = loadDiscount();
    const discountAmount = discount ? round2(subtotal * discount.percent / 100) : 0;
    const shipping = subtotal >= FREE_FROM ? 0 : SHIPPING;
    const total = round2(subtotal - discountAmount + shipping);
    const shippingLabel = shipping === 0
      ? '<span class="free">Kostenlos</span>'
      : fmt(shipping);

    const discountRow = discountAmount > 0
      ? `<div class="summary-row discount"><span>Rabatt (${escapeHtml(discount.code)} · −${discount.percent}%)</span><span>−${fmt(discountAmount)}</span></div>`
      : '';

    // Rabatt-Bereich: entweder aktiver Code oder Eingabeformular
    const discountBox = discount
      ? `<div class="discount-applied">
           <span>Code <span class="code">${escapeHtml(discount.code)}</span> aktiv · −${discount.percent}%</span>
           <button id="discountRemove">Entfernen</button>
         </div>`
      : `<div class="discount-box">
           <button class="discount-toggle" id="discountToggle">+ Rabattcode einlösen</button>
           <div class="discount-fields" id="discountFields" hidden>
             <input id="discountCode" placeholder="Code (z. B. ARCHIV10)" autocomplete="off" spellcheck="false">
             <input id="discountEmail" type="email" placeholder="Deine E-Mail" autocomplete="email">
             <button id="discountApply">Einlösen</button>
             <div class="discount-msg" id="discountMsg"></div>
           </div>
         </div>`;

    cartWrap.innerHTML = `
      <div class="cart-list">${itemsHtml}</div>
      <div class="cart-summary">
        <div class="summary-row"><span>Zwischensumme</span><span>${fmt(subtotal)}</span></div>
        ${discountRow}
        <div class="summary-row"><span>Versand${shipping === 0 ? '' : ` (gratis ab ${FREE_FROM}€)`}</span><span>${shippingLabel}</span></div>
      </div>
      ${shipping !== 0 ? '<p class="ship-note">Bei Lieferung ins EU-Ausland wählst du beim Bezahlen die passende Versandoption (12,90€) — die Endsumme wird dort angepasst.</p>' : ''}
      ${discountBox}
      <div class="cart-total">
        <span>Gesamt</span>
        <span class="amount">${fmt(total)}</span>
      </div>
      <div class="cart-cta">
        <button class="checkout-btn" id="checkoutBtn">Karte, Klarna &amp; mehr · ${fmt(total)}</button>
        <div class="paypal-divider">oder</div>
        <div id="paypalButtonContainer"></div>
        <div class="pay-methods">
          <span class="pm-label">Sicher bezahlen mit</span>
          <span class="pm-list">
            <span class="pm" title="Visa"><svg viewBox="0 8.12 24 7.75" width="46.5" height="15" role="img" aria-label="Visa" fill="currentColor"><path d="M9.112 8.262L5.97 15.758H3.92L2.374 9.775c-.094-.368-.175-.503-.461-.658C1.447 8.864.677 8.627 0 8.479l.046-.217h3.3a.904.904 0 01.894.764l.817 4.338 2.018-5.102zm8.033 5.049c.008-1.979-2.736-2.088-2.717-2.972.006-.269.262-.555.822-.628a3.66 3.66 0 011.913.336l.34-1.59a5.207 5.207 0 00-1.814-.333c-1.917 0-3.266 1.02-3.278 2.479-.012 1.079.963 1.68 1.698 2.04.756.367 1.01.603 1.006.931-.005.504-.602.725-1.16.734-.975.015-1.54-.263-1.992-.473l-.351 1.642c.453.208 1.289.39 2.156.398 2.037 0 3.37-1.006 3.377-2.564m5.061 2.447H24l-1.565-7.496h-1.656a.883.883 0 00-.826.55l-2.909 6.946h2.036l.405-1.12h2.488zm-2.163-2.656l1.02-2.815.588 2.815zm-8.16-4.84l-1.603 7.496H8.34l1.605-7.496z"/></svg></span>

            <span class="pm" title="PayPal"><svg viewBox="1.82 0 20.36 24" width="12.8" height="15" role="img" aria-label="PayPal" fill="currentColor"><path d="M15.607 4.653H8.941L6.645 19.251H1.82L4.862 0h7.995c3.754 0 6.375 2.294 6.473 5.513-.648-.478-2.105-.86-3.722-.86m6.57 5.546c0 3.41-3.01 6.853-6.958 6.853h-2.493L11.595 24H6.74l1.845-11.538h3.592c4.208 0 7.346-3.634 7.153-6.949a5.24 5.24 0 0 1 2.848 4.686M9.653 5.546h6.408c.907 0 1.942.222 2.363.541-.195 2.741-2.655 5.483-6.441 5.483H8.714Z"/></svg></span>
            <span class="pm" title="Apple Pay"><svg viewBox="0 4.32 24 15.37" width="23.4" height="15" role="img" aria-label="Apple Pay" fill="currentColor"><path d="M2.15 4.318a42.16 42.16 0 0 0-.454.003c-.15.005-.303.013-.452.04a1.44 1.44 0 0 0-1.06.772c-.07.138-.114.278-.14.43-.028.148-.037.3-.04.45A10.2 10.2 0 0 0 0 6.222v11.557c0 .07.002.138.003.207.004.15.013.303.04.452.027.15.072.291.142.429a1.436 1.436 0 0 0 .63.63c.138.07.278.115.43.142.148.027.3.036.45.04l.208.003h20.194l.207-.003c.15-.004.303-.013.452-.04.15-.027.291-.071.428-.141a1.432 1.432 0 0 0 .631-.631c.07-.138.115-.278.141-.43.027-.148.036-.3.04-.45.002-.07.003-.138.003-.208l.001-.246V6.221c0-.07-.002-.138-.004-.207a2.995 2.995 0 0 0-.04-.452 1.446 1.446 0 0 0-1.2-1.201 3.022 3.022 0 0 0-.452-.04 10.448 10.448 0 0 0-.453-.003zm0 .512h19.942c.066 0 .131.002.197.003.115.004.25.01.375.032.109.02.2.05.287.094a.927.927 0 0 1 .407.407.997.997 0 0 1 .094.288c.022.123.028.258.031.374.002.065.003.13.003.197v11.552c0 .065 0 .13-.003.196-.003.115-.009.25-.032.375a.927.927 0 0 1-.5.693 1.002 1.002 0 0 1-.286.094 2.598 2.598 0 0 1-.373.032l-.2.003H1.906c-.066 0-.133-.002-.196-.003a2.61 2.61 0 0 1-.375-.032c-.109-.02-.2-.05-.288-.094a.918.918 0 0 1-.406-.407 1.006 1.006 0 0 1-.094-.288 2.531 2.531 0 0 1-.032-.373 9.588 9.588 0 0 1-.002-.197V6.224c0-.065 0-.131.002-.197.004-.114.01-.248.032-.375.02-.108.05-.199.094-.287a.925.925 0 0 1 .407-.406 1.03 1.03 0 0 1 .287-.094c.125-.022.26-.029.375-.032.065-.002.131-.002.196-.003zm4.71 3.7c-.3.016-.668.199-.88.456-.191.22-.36.58-.316.918.338.03.675-.169.888-.418.205-.258.345-.603.308-.955zm2.207.42v5.493h.852v-1.877h1.18c1.078 0 1.835-.739 1.835-1.812 0-1.07-.742-1.805-1.808-1.805zm.852.719h.982c.739 0 1.161.396 1.161 1.089 0 .692-.422 1.092-1.164 1.092h-.979zm-3.154.3c-.45.01-.83.28-1.05.28-.235 0-.593-.264-.981-.257a1.446 1.446 0 0 0-1.23.747c-.527.908-.139 2.255.374 2.995.249.366.549.769.944.754.373-.014.52-.242.973-.242.454 0 .586.242.98.235.41-.007.667-.366.915-.73             <span class="pm" title="Google Pay"><svg viewBox="0 7.23 24 9.53" width="37.8" height="15" role="img" aria-label="Google Pay" fill="currentColor"><path d="M3.963 7.235A3.963 3.963 0 00.422 9.419a3.963 3.963 0 000 3.559 3.963 3.963 0 003.541 2.184c1.07 0 1.97-.352 2.627-.957.748-.69 1.18-1.71 1.18-2.916a4.722 4.722 0 00-.07-.806H3.964v1.526h2.14a1.835 1.835 0 01-.79 1.205c-.356.241-.814.379-1.35.379-1.034 0-1.911-.697-2.225-1.636a2.375 2.375 0 010-1.517c.314-.94 1.191-1.636 2.225-1.636a2.152 2.152 0 011.52.594l1.132-1.13a3.808 3.808 0 00-2.652-1.033zm6.501.55v6.9h.886V11.89h1.465c.603 0 1.11-.196 1.522-.588a1.911 1.911 0 00.635-1.464 1.92 1.92 0 00-.635-1.456 2.125 2.125 0 00-1.522-.598zm2.427.85a1.156 1.156 0 01.823.365 1.176 1.176 0 010 1.686 1.171 1.171 0 01-.877.357H11.35V8.635h1.487a1.156 1.156 0 01.054 0zm4.124 1.175c-.842 0-1.477.308-1.907.925l.781.491c.288-.417.68-.626 1.175-.626a1.255 1.255 0 01.856.323 1.009 1.009 0 01.366.785v.202c-.34-.193-.774-.289-1.3-.289-.617 0-1.11.145-1.479.434-.37.288-.554.677-.554 1.165a1.476 1.476 0 00.525 1.156c.35.308.785.463 1.305.463.61 0 1.098-.27 1.465-.81h.038v.655h.848v-2.909c0-.61-.19-1.09-.568-1.44-.38-.35-.896-.525-1.551-.525zm2.263.154l1.946 4.422-1.098 2.38h.915L24 9.963h-.965l-1.368 3.391h-.02l-1.406-3.39zm-2.146 2.368c.494 0 .88.11 1.156.33 0 .372-.147.696-.44.973a1.413 1.413 0 01-.997.414 1.081 1.081 0 01-.69-.232.708.708 0 01-.293-.578c0-.257.12-.47.363-.647.24-.173.54-.26.9-.26Z"/></svg></span>

          </span>
          <span class="pm-note">Mit <b>Klarna</b> kannst du auch später zahlen. Verschlüsselte Abwicklung über Stripe und PayPal — deine Zahlungsdaten sehen wir nie.</span>
        </div>
        <a class="continue-btn" href="shop.html">← Weiter stöbern</a>
      </div>
      <div class="cart-actions">
        <button class="clear-btn" id="clearCart">Warenkorb leeren</button>
      </div>`;

    renderPaypalButtons();
  }

  cartWrap.addEventListener('click', e => {
    const btn = e.target.closest('button');
    if(!btn) return;

    if(btn.id === 'checkoutBtn'){
      startCheckout();
      return;
    }

    if(btn.id === 'clearCart'){
      saveCart([]);
      renderCart();
      return;
    }

    if(btn.id === 'discountToggle'){
      const fields = document.getElementById('discountFields');
      if(fields){ fields.hidden = false; }
      const code = document.getElementById('discountCode');
      if(code){ code.focus(); }
      return;
    }

    if(btn.id === 'discountApply'){
      applyDiscount();
      return;
    }

    if(btn.id === 'discountRemove'){
      clearDiscount();
      renderCart();
      return;
    }

    const action = btn.dataset.action;
    if(!action) return;
    const index = Number(btn.dataset.index);
    const cart = loadCart();
    const item = cart[index];
    if(!item) return;

    if(action === 'inc') item.qty += 1;
    if(action === 'dec') item.qty = Math.max(1, item.qty - 1);
    if(action === 'remove') cart.splice(index, 1);

    saveCart(cart);
    renderCart();
  });

  // Enter in den Rabatt-Feldern löst "Einlösen" aus
  cartWrap.addEventListener('keydown', e => {
    if(e.key === 'Enter' && (e.target.id === 'discountCode' || e.target.id === 'discountEmail')){
      e.preventDefault();
      applyDiscount();
    }
  });

  renderCart();
</script>
