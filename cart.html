<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Warenkorb — TRIAD ARCHIV</title>
<meta name="theme-color" content="#121110">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
  /* ================= Seiten-spezifisch: Warenkorb ================= */

  .cart-wrap{
    max-width:860px;
    margin:0 auto;
    padding:0 var(--pad-x) var(--s6);
  }

  .cart-empty{
    text-align:center;
    padding:72px 24px;
    background:var(--surface);
    border:1px solid var(--line);
    color:var(--muted);
    font-size:15px;
    font-weight:300;
    line-height:1.8;
  }
  .cart-empty a{
    display:inline-block;
    margin-top:14px;
    font-family:var(--font-mono);
    font-size:12px;
    letter-spacing:2px;
    text-transform:uppercase;
    color:var(--text);
    text-decoration:none;
    border-bottom:1px solid var(--line-strong);
    padding-bottom:4px;
    transition:border-color .2s ease;
  }
  .cart-empty a:hover{ border-color:var(--text); }

  /* Positionen wie Katalogzeilen */
  .cart-list{
    display:flex;
    flex-direction:column;
    border-top:1px solid var(--line-strong);
  }

  .cart-item{
    display:flex;
    align-items:center;
    gap:18px;
    padding:18px 0;
    border-bottom:1px solid var(--line);
  }
  .cart-item-thumb{
    position:relative;
    flex:0 0 auto;
    width:64px;
    height:80px;               /* 4:5 wie die Produktbilder */
    overflow:hidden;
    background:var(--tile);
    border:1px solid var(--line);
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    color:var(--faint);
    font-family:var(--font-mono);
    font-size:8px;
    letter-spacing:0.3px;
    line-height:1.3;
    text-transform:uppercase;
    padding:4px;
  }
  /* ganzes Bild einpassen statt beschneiden/verzerren */
  .cart-item-thumb img{
    width:100%;
    height:100%;
    object-fit:contain;
    object-position:center;
    display:block;
  }
  /* aus der Shop-Kachel mitkopierte Tags im Thumbnail ausblenden */
  .cart-item-thumb .badge,
  .cart-item-thumb .stamp{ display:none; }
  /* Archiv-Platzhalter (fehlendes Bild) kompakt darstellen */
  .cart-item-thumb .img-placeholder{
    padding:4px;
    gap:4px;
    font-size:7px;
    letter-spacing:0.5px;
    line-height:1.5;
  }
  .cart-item-thumb .img-placeholder .stripes{ display:none; }
  .cart-item-info{
    flex:1;
    min-width:0;
    display:flex;
    flex-direction:column;
    gap:6px;
  }
  .cart-item-info .name{
    font-family:var(--font-sans);
    font-size:14px;
    font-weight:500;
    letter-spacing:0.2px;
    color:var(--text);
  }
  .cart-item-info .size{
    font-family:var(--font-mono);
    font-size:10px;
    letter-spacing:1.5px;
    text-transform:uppercase;
    color:var(--faint);
  }
  .cart-item-side{
    flex:0 0 auto;
    display:flex;
    flex-direction:column;
    align-items:flex-end;
    gap:10px;
  }
  .cart-item-side .price{
    font-family:var(--font-mono);
    font-size:14px;
    font-weight:500;
    color:var(--text);
    font-variant-numeric:tabular-nums;   /* Ziffern gleich breit → Preise fluchten */
  }
  .cart-item .qty-controls{
    display:flex;
    align-items:center;
    gap:10px;
    font-family:var(--font-mono);
    font-size:12px;
    color:var(--muted);
    font-variant-numeric:tabular-nums;
  }
  .qty-controls button{
    width:26px;
    height:26px;
    background:none;
    border:1px solid var(--line-strong);
    color:var(--text);
    cursor:pointer;
    font-family:var(--font-sans);
    font-size:14px;
    line-height:1;
    transition:border-color .15s ease, background .15s ease, color .15s ease;
  }
  .qty-controls button:hover{ background:var(--text); border-color:var(--text); color:var(--bg); }
  .remove-btn{
    flex:0 0 auto;
    align-self:flex-start;
    background:none;
    border:none;
    color:var(--faint);
    cursor:pointer;
    font-family:var(--font-sans);
    font-size:16px;
    line-height:1;
    padding:0 0 0 6px;
    transition:color .15s ease;
  }
  .remove-btn:hover{ color:var(--text); }

  /* Summenblock wie ein Beleg */
  .cart-summary{
    margin-top:18px;
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .summary-row{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    font-family:var(--font-mono);
    font-size:12px;
    letter-spacing:1px;
    text-transform:uppercase;
    color:var(--muted);
    font-variant-numeric:tabular-nums;
  }
  .summary-row .free{ color:var(--text); }
  .summary-row.discount span:last-child{ color:var(--accent); }

  /* ---- Rabattcode ---- */
  .discount-box{
    margin-top:14px;
    padding-top:14px;
    border-top:1px solid var(--line);
  }
  .discount-toggle{
    background:none;
    border:none;
    color:var(--muted);
    font-family:var(--font-mono);
    font-size:11px;
    letter-spacing:1.5px;
    text-transform:uppercase;
    cursor:pointer;
    padding:2px 0;
    border-bottom:1px solid transparent;
    transition:color .15s ease, border-color .15s ease;
  }
  .discount-toggle:hover{ color:var(--text); border-color:var(--line-strong); }
  .discount-fields{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-top:12px;
  }
  .discount-fields input{
    flex:1 1 160px;
    min-width:0;
    background:var(--tile);
    border:1px solid var(--line-strong);
    color:var(--text);
    font-family:var(--font-mono);
    font-size:12px;
    letter-spacing:0.5px;
    padding:11px 12px;
    border-radius:0;
    outline:none;
    transition:border-color .15s ease;
  }
  .discount-fields input::placeholder{ color:var(--faint); text-transform:none; letter-spacing:0.3px; }
  .discount-fields input:focus{ border-color:var(--text); }
  .discount-fields input#discountCode{ text-transform:uppercase; }
  .discount-fields button{
    flex:0 0 auto;
    background:var(--text);
    border:1px solid var(--text);
    color:var(--bg);
    font-family:var(--font-sans);
    font-size:12px;
    font-weight:600;
    letter-spacing:1.5px;
    text-transform:uppercase;
    padding:0 20px;
    cursor:pointer;
    transition:background .2s ease, color .2s ease;
  }
  .discount-fields button:hover{ background:transparent; color:var(--text); }
  .discount-fields button:disabled{ opacity:.55; cursor:default; }
  .discount-msg{
    flex:1 1 100%;
    font-family:var(--font-mono);
    font-size:11px;
    letter-spacing:0.3px;
    line-height:1.5;
    margin-top:2px;
  }
  .discount-msg.err{ color:var(--accent); }
  .discount-msg.ok{ color:var(--muted); }
  .discount-applied{
    margin-top:14px;
    padding:12px 14px;
    border:1px solid var(--line-strong);
    background:var(--tile);
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    font-family:var(--font-mono);
    font-size:11px;
    letter-spacing:1px;
    text-transform:uppercase;
    color:var(--text);
  }
  .discount-applied .code{ color:var(--accent); font-weight:600; }
  .discount-applied button{
    background:none;
    border:none;
    color:var(--faint);
    font-family:var(--font-mono);
    font-size:10px;
    letter-spacing:1.5px;
    text-transform:uppercase;
    cursor:pointer;
    padding:2px 0;
    border-bottom:1px solid transparent;
    transition:color .15s ease, border-color .15s ease;
  }
  .discount-applied button:hover{ color:var(--text); border-color:var(--line-strong); }
  .cart-total{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    margin-top:8px;
    padding:18px 0;
    border-top:1px solid var(--line-strong);   /* Summe klar von Positionen abgesetzt */
    font-family:var(--font-mono);
    font-size:12px;
    text-transform:uppercase;
    letter-spacing:2px;
    color:var(--muted);
  }
  .cart-total .amount{
    color:var(--text);
    font-weight:500;
    font-size:22px;                            /* Endsumme als visueller Anker */
    letter-spacing:0.5px;
    font-variant-numeric:tabular-nums;
  }

  .ship-note{
    margin-top:-6px;
    padding-bottom:6px;
    font-family:var(--font-mono);
    font-size:11px;
    line-height:1.6;
    letter-spacing:0.3px;
    color:var(--faint);
  }

  /* Button-Gruppe unter dem Warenkorb */
  .cart-cta{
    display:flex;
    flex-direction:column;
    gap:10px;
    margin:24px 0 14px;
  }
  .checkout-btn,
  .continue-btn{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    width:100%;
    font-family:var(--font-sans);
    font-size:13px;
    font-weight:600;
    letter-spacing:2px;
    text-transform:uppercase;
    text-decoration:none;
    padding:17px 20px;
    border-radius:0;
    cursor:pointer;
    transition:background .25s ease, color .25s ease, border-color .25s ease, transform .1s ease;
  }
  /* primäre CTA: Zur Kasse / bezahlen */
  .checkout-btn{
    background:var(--text);
    border:1px solid var(--text);
    color:var(--bg);
  }
  .checkout-btn:hover{ background:transparent; color:var(--text); border-color:var(--text); }
  .checkout-btn:disabled{ opacity:.6; cursor:default; }
  /* sekundär: weiter einkaufen */
  .continue-btn{
    background:transparent;
    border:1px solid var(--line-strong);
    color:var(--text);
  }
  .continue-btn:hover{ border-color:var(--text); }
  .checkout-btn:active,
  .continue-btn:active{ transform:translateY(1px); }

  .paypal-divider{
    text-align:center;
    font-family:var(--font-mono);
    font-size:10px;
    letter-spacing:2px;
    text-transform:uppercase;
    color:var(--faint);
    margin:2px 0;
  }
  #paypalButtonContainer{ min-height:45px; }

  .cart-actions{
    display:flex;
    justify-content:flex-end;
  }
  .clear-btn{
    background:none;
    border:none;
    color:var(--faint);
    font-family:var(--font-mono);
    font-size:10px;
    text-transform:uppercase;
    letter-spacing:2px;
    padding:8px 0;
    cursor:pointer;
    border-bottom:1px solid transparent;
    transition:color .15s ease, border-color .15s ease;
  }
  .clear-btn:hover{ color:var(--text); border-color:var(--line-strong); }
</style>
</head>
<body>

<header>
  <a class="logo" href="shop.html">
    <span class="stripes"><span></span><span></span><span></span></span>
    TRIAD <span class="archive">ARCHIV</span>
  </a>
  <div class="header-icons">
    <a href="shop.html">Zurück zum Archiv</a>
  </div>
</header>

<h1 class="page-title">Warenkorb</h1>
<p class="page-title-sub">Deine Auswahl aus dem Archiv</p>

<div class="cart-wrap" id="cartWrap"></div>

<footer>
  <div class="foot-inner">
    <div class="foot-logo">
      <span class="stripes"><span></span><span></span><span></span></span>
      Triad Archiv
    </div>
    <div class="foot-links">
      <a href="shop.html">Archiv</a>
      <a href="versand.html">Versand</a>
      <a href="impressum.html">Impressum</a>
      <a href="datenschutz.html">Datenschutz</a>
      <a href="widerruf.html">Widerruf</a>
      <a href="agb.html">AGB</a>
    </div>
  </div>
  <div class="foot-copy">© 2026 TRIAD ARCHIV — Alle Rechte vorbehalten.</div>
</footer>

<script>
  const cartWrap = document.getElementById('cartWrap');

  // Versandkosten (muss mit checkout.mjs und versand.html übereinstimmen).
  // Anzeige hier ist der DE-Richtwert; bei Lieferung ins EU-Ausland wählt der Kunde
  // beim Bezahlvorgang (Stripe) die passende, teurere Option selbst aus.
  const SHIPPING = 6.19;
  const FREE_FROM = 90;

  function fmt(n){ return n.toFixed(2).replace('.', ',') + '€'; }
  function round2(n){ return Math.round((Number(n)||0) * 100) / 100; }

  function loadCart(){
    return JSON.parse(localStorage.getItem('triadCart') || '[]');
  }
  function saveCart(cart){
    localStorage.setItem('triadCart', JSON.stringify(cart));
  }

  /* ---------- Rabattcode ---------- */
  // Gespeichert wird ein bereits vom Server geprüfter Rabatt: {code, email, percent}
  function loadDiscount(){
    try { return JSON.parse(localStorage.getItem('triadDiscount') || 'null'); }
    catch(e){ return null; }
  }
  function saveDiscount(d){ localStorage.setItem('triadDiscount', JSON.stringify(d)); }
  function clearDiscount(){ localStorage.removeItem('triadDiscount'); }

  async function applyDiscount(){
    const codeEl = document.getElementById('discountCode');
    const emailEl = document.getElementById('discountEmail');
    const msgEl = document.getElementById('discountMsg');
    const btn = document.getElementById('discountApply');
    const code = (codeEl.value || '').trim();
    const email = (emailEl.value || '').trim();

    if(!code){ showDiscountMsg('Bitte einen Code eingeben.', 'err'); return; }
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){ showDiscountMsg('Bitte eine gültige E-Mail eingeben.', 'err'); return; }

    btn.disabled = true;
    const original = btn.textContent;
    btn.textContent = 'Prüfe …';
    try {
      const r = await fetch('/api/validate-code', {
        method:'POST',
        headers:{ 'Content-Type':'application/json' },
        body: JSON.stringify({ code, email })
      });
      const data = await r.json();
      if(data.valid){
        saveDiscount({ code: code.toUpperCase(), email: email.toLowerCase(), percent: data.percent });
        renderCart();
        return;
      }
      const reasons = {
        unknown: 'Dieser Code ist ungültig.',
        email: 'Bitte eine gültige E-Mail eingeben.',
        used: 'Dieser Code wurde für diese E-Mail bereits genutzt (gilt nur für die erste Bestellung).',
      };
      showDiscountMsg(reasons[data.reason] || 'Code konnte nicht eingelöst werden.', 'err');
    } catch(e){
      showDiscountMsg('Verbindung fehlgeschlagen. Bitte später erneut versuchen.', 'err');
    } finally {
      const b = document.getElementById('discountApply');
      if(b){ b.disabled = false; b.textContent = original; }
    }
  }

  function showDiscountMsg(text, kind){
    const msgEl = document.getElementById('discountMsg');
    if(!msgEl) return;
    msgEl.textContent = text;
    msgEl.className = 'discount-msg ' + (kind || '');
  }

  function escapeHtml(str){
    return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  // Rabatt-Payload für Checkout (nur Code + E-Mail; der Server prüft erneut).
  function discountPayload(){
    const d = loadDiscount();
    return d ? { code: d.code, email: d.email } : null;
  }

  // Für Bezahlung: gewählte Größe in den Artikelnamen schreiben, damit sie in der
  // Stripe/PayPal-Bestellung sichtbar ist (wichtig fürs Packen). id/Preis bleiben gleich.
  function checkoutItems(){
    return loadCart().map(it => ({
      ...it,
      name: (it.size && it.size !== 'Onesize') ? `${it.name} (Größe ${it.size})` : it.name
    }));
  }

  function startCheckout(){
    const cart = loadCart();
    if(cart.length === 0) return;
    const btn = document.getElementById('checkoutBtn');
    const original = btn.textContent;
    btn.disabled = true;
    btn.textContent = 'Weiterleitung zu Stripe …';
    fetch('/api/checkout', {
      method:'POST',
      headers:{ 'Content-Type':'application/json' },
      body: JSON.stringify({ items: checkoutItems(), discount: discountPayload() })
    })
      .then(r => r.json())
      .then(data => {
        if(data.url){ window.location.href = data.url; }   // Stripe-Bezahlseite
        else { throw new Error(data.error || 'Unbekannter Fehler'); }
      })
      .catch(err => {
        btn.disabled = false;
        btn.textContent = original;
        alert('Zahlung konnte nicht gestartet werden:\n' + err.message);
      });
  }

  /* ---------- PayPal ---------- */
  let paypalSdkPromise = null;
  function loadPaypalSdk(){
    if(paypalSdkPromise) return paypalSdkPromise;
    paypalSdkPromise = fetch('/api/paypal-config')
      .then(r => r.json())
      .then(cfg => new Promise((resolve, reject) => {
        if(!cfg.clientId){ reject(new Error('PayPal ist noch nicht eingerichtet.')); return; }
        if(window.paypal){ resolve(window.paypal); return; }
        const s = document.createElement('script');
        s.src = `https://www.paypal.com/sdk/js?client-id=${encodeURIComponent(cfg.clientId)}&currency=EUR&intent=capture`;
        s.onload = () => resolve(window.paypal);
        s.onerror = () => reject(new Error('PayPal konnte nicht geladen werden.'));
        document.head.appendChild(s);
      }));
    return paypalSdkPromise;
  }

  function renderPaypalButtons(){
    const container = document.getElementById('paypalButtonContainer');
    if(!container) return;
    container.innerHTML = '';
    loadPaypalSdk().then(paypal => {
      paypal.Buttons({
        style: { layout:'horizontal', color:'gold', shape:'rect', label:'paypal', height:45, tagline:false },
        createOrder: () => fetch('/api/paypal-create-order', {
          method:'POST',
          headers:{ 'Content-Type':'application/json' },
          body: JSON.stringify({ items: checkoutItems(), discount: discountPayload() })
        }).then(r => r.json()).then(data => {
          if(!data.id) throw new Error(data.error || 'PayPal-Bestellung fehlgeschlagen.');
          return data.id;
        }),
        onApprove: (data) => fetch('/api/paypal-capture-order', {
          method:'POST',
          headers:{ 'Content-Type':'application/json' },
          body: JSON.stringify({ orderID: data.orderID })
        }).then(r => r.json()).then(res => {
          if(!res.ok) throw new Error(res.error || 'Zahlung konnte nicht abgeschlossen werden.');
          localStorage.removeItem('triadCart');
          window.location.href = 'success.html?paypal=1';
        }).catch(err => alert('PayPal-Zahlung fehlgeschlagen:\n' + err.message)),
        onError: (err) => alert('PayPal-Zahlung fehlgeschlagen:\n' + (err && err.message ? err.message : err))
      }).render(container);
    }).catch(err => { console.error(err); container.innerHTML = ''; });
  }

  function renderCart(){
    const cart = loadCart();

    if(cart.length === 0){
      cartWrap.innerHTML = `
        <div class="cart-empty">
          Dein Warenkorb ist noch leer.<br>
          <a href="shop.html">Zum Archiv →</a>
        </div>`;
      return;
    }

    const itemsHtml = cart.map((item, i) => `
      <div class="cart-item">
        <div class="cart-item-thumb">${item.thumb || 'Adidas<br>Produkt'}</div>
        <div class="cart-item-info">
          <div class="name">${escapeHtml(item.name)}</div>
          <div class="size">Größe: ${escapeHtml(item.size || 'Onesize')}</div>
        </div>
        <div class="cart-item-side">
          <div class="price">${fmt(item.price * item.qty)}</div>
          <div class="qty-controls">
            <button data-action="dec" data-index="${i}" aria-label="Menge verringern">–</button>
            <span>${item.qty}</span>
            <button data-action="inc" data-index="${i}" aria-label="Menge erhöhen">+</button>
          </div>
        </div>
        <button class="remove-btn" data-action="remove" data-index="${i}" aria-label="Artikel entfernen">✕</button>
      </div>`).join('');

    const subtotal = cart.reduce((sum, item) => sum + item.price * item.qty, 0);
    const discount = loadDiscount();
    const discountAmount = discount ? round2(subtotal * discount.percent / 100) : 0;
    const shipping = subtotal >= FREE_FROM ? 0 : SHIPPING;
    const total = round2(subtotal - discountAmount + shipping);
    const shippingLabel = shipping === 0
      ? '<span class="free">Kostenlos</span>'
      : fmt(shipping);

    const discountRow = discountAmount > 0
      ? `<div class="summary-row discount"><span>Rabatt (${escapeHtml(discount.code)} · −${discount.percent}%)</span><span>−${fmt(discountAmount)}</span></div>`
      : '';

    // Rabatt-Bereich: entweder aktiver Code oder Eingabeformular
    const discountBox = discount
      ? `<div class="discount-applied">
           <span>Code <span class="code">${escapeHtml(discount.code)}</span> aktiv · −${discount.percent}%</span>
           <button id="discountRemove">Entfernen</button>
         </div>`
      : `<div class="discount-box">
           <button class="discount-toggle" id="discountToggle">+ Rabattcode einlösen</button>
           <div class="discount-fields" id="discountFields" hidden>
             <input id="discountCode" placeholder="Code (z. B. ARCHIV10)" autocomplete="off" spellcheck="false">
             <input id="discountEmail" type="email" placeholder="Deine E-Mail" autocomplete="email">
             <button id="discountApply">Einlösen</button>
             <div class="discount-msg" id="discountMsg"></div>
           </div>
         </div>`;

    cartWrap.innerHTML = `
      <div class="cart-list">${itemsHtml}</div>
      <div class="cart-summary">
        <div class="summary-row"><span>Zwischensumme</span><span>${fmt(subtotal)}</span></div>
        ${discountRow}
        <div class="summary-row"><span>Versand${shipping === 0 ? '' : ` (gratis ab ${FREE_FROM}€)`}</span><span>${shippingLabel}</span></div>
      </div>
      ${shipping !== 0 ? '<p class="ship-note">Bei Lieferung ins EU-Ausland wählst du beim Bezahlen die passende Versandoption (12,90€) — die Endsumme wird dort angepasst.</p>' : ''}
      ${discountBox}
      <div class="cart-total">
        <span>Gesamt</span>
        <span class="amount">${fmt(total)}</span>
      </div>
      <div class="cart-cta">
        <button class="checkout-btn" id="checkoutBtn">Zur Kasse · ${fmt(total)} bezahlen</button>
        <div class="paypal-divider">oder</div>
        <div id="paypalButtonContainer"></div>
        <a class="continue-btn" href="shop.html">← Weiter stöbern</a>
      </div>
      <div class="cart-actions">
        <button class="clear-btn" id="clearCart">Warenkorb leeren</button>
      </div>`;

    renderPaypalButtons();
  }

  cartWrap.addEventListener('click', e => {
    const btn = e.target.closest('button');
    if(!btn) return;

    if(btn.id === 'checkoutBtn'){
      startCheckout();
      return;
    }

    if(btn.id === 'clearCart'){
      saveCart([]);
      renderCart();
      return;
    }

    if(btn.id === 'discountToggle'){
      const fields = document.getElementById('discountFields');
      if(fields){ fields.hidden = false; }
      const code = document.getElementById('discountCode');
      if(code){ code.focus(); }
      return;
    }

    if(btn.id === 'discountApply'){
      applyDiscount();
      return;
    }

    if(btn.id === 'discountRemove'){
      clearDiscount();
      renderCart();
      return;
    }

    const action = btn.dataset.action;
    if(!action) return;
    const index = Number(btn.dataset.index);
    const cart = loadCart();
    const item = cart[index];
    if(!item) return;

    if(action === 'inc') item.qty += 1;
    if(action === 'dec') item.qty = Math.max(1, item.qty - 1);
    if(action === 'remove') cart.splice(index, 1);

    saveCart(cart);
    renderCart();
  });

  // Enter in den Rabatt-Feldern löst "Einlösen" aus
  cartWrap.addEventListener('keydown', e => {
    if(e.key === 'Enter' && (e.target.id === 'discountCode' || e.target.id === 'discountEmail')){
      e.preventDefault();
      applyDiscount();
    }
  });

  renderCart();
</script>

</body>
</html>
