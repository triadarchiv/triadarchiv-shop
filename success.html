<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bestellung bestätigt — TRIAD ARCHIV</title>
<meta name="theme-color" content="#121110">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
  body{
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  .card{
    max-width:520px;
    width:100%;
    text-align:center;
    background:var(--surface);
    border:1px solid var(--line);
    padding:56px 36px;
  }
  .card .logo{
    justify-content:center;
    margin-bottom:32px;
    font-size:14px;
  }
  .order-no{
    font-family:var(--font-mono);
    font-size:10px;
    letter-spacing:3px;
    text-transform:uppercase;
    color:var(--faint);
    margin-bottom:18px;
  }
  h1{
    font-family:var(--font-display);
    font-weight:400;
    font-size:clamp(28px, 6vw, 44px);
    letter-spacing:0.01em;
    line-height:0.95;
    text-transform:uppercase;
    margin-bottom:18px;
  }
  .card p{
    color:var(--muted);
    font-size:15px;
    font-weight:300;
    line-height:1.8;
    margin-bottom:32px;
  }
</style>
</head>
<body>
  <div class="card">
    <a class="logo" href="shop.html">
      <span class="stripes"><span></span><span></span><span></span></span>
      TRIAD <span class="archive">ARCHIV</span>
    </a>
    <div class="order-no">Bestellung eingegangen</div>
    <h1>Danke für deine Bestellung</h1>
    <p>Deine Zahlung ist eingegangen. Du erhältst in Kürze eine Bestätigung per E-Mail. Wir kümmern uns um den Versand.</p>
    <a class="btn-solid" href="shop.html">Zurück zum Archiv</a>
  </div>

  <script>
    (function(){
      const params = new URLSearchParams(location.search);

      // Warenkorb nach erfolgreicher Zahlung leeren -- außer beim PayPal-Schnellkauf
      // am Produkt (keepCart=1): da wird nur das eine Produkt bezahlt, der Warenkorb
      // mit eventuell anderen, noch nicht bezahlten Artikeln soll erhalten bleiben.
      if(!params.has('keepCart')){
        localStorage.removeItem('triadCart');
      }

      // Bestellung serverseitig verifizieren -> Artikel als verkauft markieren, Bestellung protokollieren
      const sessionId = params.get('session_id');
      if(sessionId){
        fetch('/api/order-complete?session_id=' + encodeURIComponent(sessionId))
          .catch(() => { /* stiller Fehler: Bestellung ist trotzdem bezahlt */ });
      }
      // PayPal-Bestellungen sind zum Zeitpunkt der Weiterleitung hierher bereits
      // server-seitig erfasst (paypal-capture-order), hier ist nichts weiter nötig.
    })();
  </script>
</body>
</html>
