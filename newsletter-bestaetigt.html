<!DOCTYPE html>

<meta name="robots" content="noindex">

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
  html, body{ height:100%; }
  body{
    display:flex;

    max-width:520px;

  }
  .card .logo{

    margin-bottom:32px;

  }
  .confirm-tag{
    font-family:var(--font-mono);
    font-size:10px;
    letter-spacing:3px;
    text-transform:uppercase;
    color:var(--faint);
    margin-bottom:18px;
  }
  h1{
    font-family:var(--font-display);
    font-weight:400;
    font-size:clamp(28px, 6vw, 44px);
    letter-spacing:0.01em;
    line-height:0.95;
    text-transform:uppercase;
    margin-bottom:18px;
  }
  .card p{
    color:var(--muted);
    font-size:15px;
    font-weight:300;
    line-height:1.8;
    margin-bottom:32px;
  }

  <div class="card">
